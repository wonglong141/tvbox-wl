name: 生成聚合 all.json

on:
  workflow_dispatch:
  push:
    paths:
      - tvbox/**
      - gen_all.py

jobs:
  gen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 生成并推送 all.json
        run: |
          python gen_all.py
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add all.json
          git commit -m auto-regenerate-all-json || echo no-change
          git push
